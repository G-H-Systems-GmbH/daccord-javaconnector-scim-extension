# Apache SCIMple SCIM 2.0 Reference Server
# Deploy: kubectl apply -f scimple-server.yaml
# Access: http://localhost:30880/v2/
# Auth:   Basic scimadmin:YOUR_PASSWORD
# Context path: /v2 (not /scim/v2)
#
# Key endpoints:
#   GET  /v2/ServiceProviderConfig
#   GET  /v2/Users
#   POST /v2/Users
#   GET  /v2/Groups
#   PATCH /v2/Groups/{id}  (add/remove members)
---
apiVersion: v1
kind: Namespace
metadata:
  name: scim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scimple-server
  namespace: scim
  labels:
    app: scimple-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scimple-server
  template:
    metadata:
      labels:
        app: scimple-server
    spec:
      containers:
        - name: scimple-server
          image: tirasa/scimple-server:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_SECURITY_USER_NAME
              value: scimadmin
            - name: SPRING_SECURITY_USER_PASSWORD
              value: YOUR_PASSWORD
          readinessProbe:
            httpGet:
              path: /v2/ServiceProviderConfig
              port: 8080
              httpHeaders:
                - name: Authorization
                  value: Basic c2NpbWFkbWluOnNjaW1wYXNzd29yZA==
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scimple-server
  namespace: scim
spec:
  selector:
    app: scimple-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30880
  type: NodePort
